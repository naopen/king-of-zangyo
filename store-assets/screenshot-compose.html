<!DOCTYPE html>
<!--
  Chrome ウェブストア用のスクリーンショット（1280x800）を書き出すページ。
  テスト用HTML（test/ サブモジュール）を枠の中に読み込み、上にOFF、下にONを並べる。
  OFFとONは同じ倍率で、同じ列が上下でそろう。右上の角だけを線で区切り、設定画面（popup.html）を置く。

  書き出し方（リポジトリのルートで）
    1. ルートを配信する。macOSの権限で ~/Documents は python の http.server から読めないので、一時フォルダーに写してから配信する
       rsync -a --exclude .git ./ "$TMPDIR/koz/" && python3 -m http.server 8731 --bind 127.0.0.1 --directory "$TMPDIR/koz"
    2. 別の端末で、ヘッドレスの Chrome で撮る
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
         --force-device-scale-factor=1 --user-data-dir="$TMPDIR/koz-chrome" --window-size=1280,800 \
         --virtual-time-budget=20000 --screenshot=store-assets/screenshot.png \
         "http://127.0.0.1:8731/store-assets/screenshot-compose.html?export=1"

  ブラウザで開くと、テスト用HTMLの保存データ（localStorage）を下の値で上書きする。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ストア用スクリーンショット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap">
<style>
  body { margin: 0; padding: 16px; background: #ddd; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .shot { width: 1280px; height: 800px; position: relative; overflow: hidden; background: #fff; }
  .clip { position: absolute; overflow: hidden; background: #fff; }
  .clip .frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .clip iframe { border: 0; display: block; }
  /* 設定画面の地は #f9f9f9 で白い背景と見分けにくいので、1pxの枠で輪郭を出す */
  .clip.popup { outline: 1px solid #d0d0d0; }
  .cap { position: absolute; color: #1a1a1a; font-family: "Noto Sans JP", sans-serif; font-size: 28px; font-weight: 700; line-height: 1; }
  .rule { position: absolute; background: #d0d0d0; }
</style>
</head>
<body>
<div class="shot" id="shot"></div>
<script>
  const SRC = '../test/extension-test.html';
  const POPUP = '../popup.html';
  const shot = document.getElementById('shot');

  // 撮る前に、テスト用HTMLの保存データを決まった値にする（2026年度を2026/10/29 18:30に250:12で取得済み）。
  // ヘッドレスのChromeは毎回まっさらなので、ここで入れないと年間データが「未取得」で写る。
  // lastUpdated は content.js の formatDateTime と同じ「YYYY/MM/DD HH:mm」の形にする
  localStorage.setItem('king-of-zangyo-mock-sync', JSON.stringify({
    kingOfZangyoAnnualDataYears: [2026],
    kingOfZangyoAnnualData_2026: { totalMinutes: 250 * 60 + 12, lastUpdated: '2026/10/29 18:30', fiscalYearStart: 4, fiscalYear: 2026 },
  }));
  localStorage.setItem('king-of-zangyo-mock-local', '{}');

  // ?export=1 のときは、画像の外側の余白を消して 1280x800 ちょうどで撮れるようにする
  if (new URLSearchParams(location.search).has('export')) document.body.style.padding = '0';

  // 見えなくした拡張の列は、罫線と背景も消して、表がそこで終わっているように見せる
  function hideExtensionColumn(doc) {
    ['king-of-zangyo-header', 'king-of-zangyo-cell'].forEach(id => { const c = doc.getElementById(id); if (c) Object.assign(c.style, { border: 'none', background: 'transparent', visibility: 'hidden' }); });
  }

  // 実装前の仮。ボタン名「更新」と「?使い方」の入口を画面の上で足している。
  // 使い方ページと入口を実装したら、この関数と呼び出しを消して、拡張そのものの表示で撮り直す
  function applyPlannedUi(doc) {
    const btn = doc.querySelector('#king-of-zangyo-annual-section button');
    btn.querySelector('span').textContent = '更新';
    const pill = doc.createElement('span');
    pill.style.cssText = 'display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 5px;margin-left:4px;border:1px solid #999;border-radius:14px;background:#fff;color:#555;font-size:13px;position:relative;top:-1px';
    pill.innerHTML = '<span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#777;color:#fff;font-weight:bold;font-size:12px">?</span>使い方';
    btn.after(pill);
  }

  function prepare(doc, off) {
    doc.querySelectorAll('body *').forEach(e => { const p = getComputedStyle(e).position; if (p === 'fixed' || p === 'sticky') e.style.display = 'none'; });
    // 月別データの上にある KING OF TIME のボタン（スケジュール申請など）は、切り抜きの上端に端だけ写るので隠す
    doc.querySelectorAll('button, input[type=button], input[type=submit], select').forEach(e => { if (!e.closest('#king-of-zangyo-annual-section')) e.style.visibility = 'hidden'; });
    // ボタンの並び（ツールバー）の下線も、切り抜きの上端に1本の線として写るので隠す
    doc.querySelectorAll('.htBlock-toolbar').forEach(e => { if (!e.querySelector('#king-of-zangyo-annual-section')) e.style.visibility = 'hidden'; });
    // OFFは拡張の部品を消さずに見えなくする。消すと表の列幅が組み直され、ONと列の位置がずれる
    if (off) { doc.querySelectorAll('[id^="king-of-zangyo"]').forEach(e => { e.style.visibility = 'hidden'; e.querySelectorAll('*').forEach(c => c.style.visibility = 'hidden'); }); hideExtensionColumn(doc); return; }
    applyPlannedUi(doc);
  }
  const abs = (doc, el) => { const w = doc.defaultView, r = el.getBoundingClientRect(); return { l: r.left + w.scrollX, t: r.top + w.scrollY, r: r.right + w.scrollX, b: r.bottom + w.scrollY }; };
  // option 要素など大きさ0の要素は (0,0) を返すので除く
  const visible = e => { const r = e.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
  const union = (doc, els) => { const rs = els.flatMap(p => [p, ...p.querySelectorAll('*')]).filter(visible).map(e => abs(doc, e)); return { l: Math.min(...rs.map(r => r.l)), t: Math.min(...rs.map(r => r.t)), r: Math.max(...rs.map(r => r.r)), b: Math.max(...rs.map(r => r.b)) }; };

  function frameFor(src, width, height, extraClass) {
    const f = document.createElement('iframe'); f.src = src + '?r=' + Math.random(); f.scrolling = 'no';
    f.style.width = width + 'px'; f.style.height = height + 'px';
    const frame = document.createElement('div'); frame.className = 'frame'; frame.appendChild(f);
    const clip = document.createElement('div'); clip.className = 'clip' + (extraClass ? ' ' + extraClass : ''); clip.appendChild(frame);
    clip.style.visibility = 'hidden'; shot.appendChild(clip);
    return { f, frame, clip };
  }
  function load(off) {
    return new Promise(res => {
      const p = frameFor(SRC, 1500, 900);
      // 拡張の描画が終わるのを待つ
      p.f.onload = () => setTimeout(() => { prepare(p.f.contentDocument, off); res({ ...p, doc: p.f.contentDocument }); }, 2500);
    });
  }

  // 拡張アイコンを押して開く設定画面。popup.js は chrome API が無いので動かない。設定画面の状態は、ここで作る
  function loadPopup() {
    return new Promise(res => {
      const p = frameFor(POPUP, 300, 600, 'popup');
      p.f.onload = () => setTimeout(() => {
        const d = p.f.contentDocument;
        // スイッチは0.3秒かけて色が変わる。撮る瞬間に途中の色で写らないよう、動きを止める
        const st = d.createElement('style'); st.textContent = '*,*::before{transition:none!important}'; d.head.appendChild(st);
        // 既定の状態（どちらもオン）で写す
        d.getElementById('toggle-switch').checked = true;
        d.getElementById('legend-toggle-switch').checked = true;
        d.getElementById('standard-hours').value = 7.5;
        d.getElementById('fiscal-year-start').value = '4';
        // フッター（thanks to と developed by の2行）は写さない
        d.querySelector('.footer').style.display = 'none';
        // 実装前の仮。設定の下に「使い方を見る」を置く予定。実装したら消す
        const a = d.createElement('a'); a.textContent = '使い方を見る'; a.href = '#';
        a.style.cssText = 'display:block;text-align:center;margin:4px 0 0;color:#1565c0;text-decoration:underline;font-size:14px';
        d.querySelector('.container').appendChild(a);
        const h = d.querySelector('.container').getBoundingClientRect().height;
        p.f.style.height = h + 'px';
        res({ ...p, w: 300, h });
      }, 500);
    });
  }

  // 枠を切り抜く範囲まで縮めてからスクロールする。広いままだと右へ十分にスクロールできない
  function crop(p, box, s, x, y) {
    const bw = box.r - box.l, bh = box.b - box.t;
    p.f.style.width = bw + 'px'; p.f.style.height = bh + 'px';
    p.doc.defaultView.scrollTo(box.l, box.t);
    p.frame.style.transform = `scale(${s})`;
    Object.assign(p.clip.style, { left: x + 'px', top: y + 'px', width: bw * s + 'px', height: bh * s + 'px', visibility: 'visible' });
  }
  function caption(text, x, y) { const c = document.createElement('div'); c.className = 'cap'; c.textContent = text; c.style.left = x + 'px'; c.style.top = y + 'px'; shot.appendChild(c); }
  function rule(x, y, w, h) { const d = document.createElement('div'); d.className = 'rule'; Object.assign(d.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); shot.appendChild(d); }

  (async () => {
    const [on, off, popup] = [await load(false), await load(true), await loadPopup()];
    const PAD = 14, CAP = 26, CAP_GAP = 14, GAP = 44, SIDE = 40, TOP = 40, INSET = 28;
    const W = b => b.r - b.l, H = b => b.b - b.t;

    // 左端は、どちらも「③育介短所定内残業」の列の境目ちょうど。余白を足すと隣の列が細く写る。
    // この位置なら月の凡例（表の右端にそろえてある）も左端まで入る
    const onTbl = on.doc.querySelector('th.custom4').closest('table');
    const onBox = union(on.doc, [on.doc.getElementById('king-of-zangyo-annual-section'), on.doc.getElementById('king-of-zangyo-monthly-legend'), onTbl]);
    // 上端は年別データの見出しの行のすぐ上。それより上は KING OF TIME の区切り線が写る
    const annualTop = abs(on.doc, on.doc.getElementById('king-of-zangyo-annual-section')).t;
    Object.assign(onBox, { l: abs(on.doc, on.doc.querySelector('th.custom4')).l, t: annualTop - 1, r: onBox.r + PAD, b: onBox.b + PAD });

    const ot = abs(off.doc, off.doc.querySelector('th.custom4').closest('table'));
    // 右端は、見えなくした拡張の列の手前（フレックス不足時間の列の右端）まで
    const offBox = { l: abs(off.doc, off.doc.querySelector('th.custom4')).l, t: ot.t - 6, r: abs(off.doc, off.doc.querySelector('th.custom7')).r + 1, b: ot.b + PAD };

    // OFFとONは画像の幅いっぱいに使う。OFFもONと同じ倍率にする
    const s = Math.min((1280 - SIDE * 2) / W(onBox), 1.6);
    // 設定画面は表より小さくする。大きいと区画が縦に伸び、その下から始まるONがOFFから離れる
    const sPop = 0.7;
    const wPop = popup.w * sPop, hPop = popup.h * sPop;

    // 右上の角だけを区切って、設定画面の区画にする。区画の左と下に線を引く
    const cornerX = 1280 - SIDE - wPop - INSET;
    const cornerB = TOP + CAP + CAP_GAP + hPop + INSET;
    // ONの右側には年別データがあるので、ONは区画の下の線より下から始める。OFFはONのすぐ上に置く
    const onY = Math.max(TOP + CAP + CAP_GAP + H(offBox) * s + GAP + CAP + CAP_GAP, cornerB + INSET);
    const offY = onY - CAP_GAP - CAP - GAP - H(offBox) * s;

    caption('残業時間表示 OFF', SIDE, offY - CAP_GAP - CAP);
    crop(off, offBox, s, SIDE, offY);
    caption('残業時間表示 ON', SIDE, onY - CAP_GAP - CAP);
    crop(on, onBox, s, SIDE, onY);

    rule(cornerX, 0, 1, cornerB);
    rule(cornerX, cornerB, 1280 - cornerX, 1);
    caption('設定画面', cornerX + INSET, TOP);
    popup.frame.style.transform = `scale(${sPop})`;
    Object.assign(popup.clip.style, { left: (cornerX + INSET) + 'px', top: (TOP + CAP + CAP_GAP) + 'px', width: wPop + 'px', height: hPop + 'px', visibility: 'visible' });
  })();
</script>
</body>
</html>
